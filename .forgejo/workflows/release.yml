name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: "Release"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: "!contains(github.event.head_commit.message, 'chore(release): version packages')"
    permissions:
      contents: write
    env:
      _EXPERIMENTAL_DAGGER_RUNNER_HOST: docker-container://dagger-engine-v0.20.6

    steps:
      - name: Setup
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git curl ca-certificates docker.io && update-ca-certificates

      - name: Checkout
        run: |
          git init
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          git fetch --depth=1 origin "${GITHUB_REF}"
          git checkout FETCH_HEAD

      - name: Install Dagger
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=v0.20.6 sh
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Release
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          dagger call release \
            --token=env:RELEASE_TOKEN \
            --repo-url="${{ github.server_url }}/${{ github.repository }}"
