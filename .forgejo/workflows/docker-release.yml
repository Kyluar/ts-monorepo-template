name: Docker Release

on:
  push:
    tags:
      - 'web@*'

jobs:
  docker:
    name: "Publish Docker Image"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      _EXPERIMENTAL_DAGGER_RUNNER_HOST: docker-container://dagger-engine-v0.20.6

    steps:
      - name: Setup
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git curl ca-certificates docker.io && update-ca-certificates

      - name: Checkout
        run: |
          git init
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          git fetch --depth=1 origin "${GITHUB_REF}"
          git checkout FETCH_HEAD

      - name: Install Dagger
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=v0.20.6 sh
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#web@}" >> $GITHUB_OUTPUT

      - name: Publish versioned Docker image
        run: dagger call publish-versioned-app --app=web --version=${{ steps.version.outputs.version }}
