name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  fast_tests:
    name: "Fast Tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: fast-tests-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      _EXPERIMENTAL_DAGGER_RUNNER_HOST: docker-container://dagger-engine-v0.20.6

    steps:
      - name: Setup
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git curl ca-certificates docker.io && update-ca-certificates

      - name: Checkout
        run: |
          git init
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          git fetch --depth=1 origin "${GITHUB_REF}"
          git checkout FETCH_HEAD

      - name: Install Dagger
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=v0.20.6 sh
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Run Fast Tests
        run: dagger call fast-tests --output=./coverage

  e2e:
    name: "E2E Tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: e2e-tests-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      _EXPERIMENTAL_DAGGER_RUNNER_HOST: docker-container://dagger-engine-v0.20.6

    steps:
      - name: Setup
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git curl ca-certificates docker.io && update-ca-certificates

      - name: Checkout
        run: |
          git init
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          git fetch --depth=1 origin "${GITHUB_REF}"
          git checkout FETCH_HEAD

      - name: Install Dagger
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=v0.20.6 sh
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Run E2E Tests
        run: dagger call e-2-e-tests --output=./playwright-results
